<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caroline Coolidge – New Gallery Layout</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      color: #0f0f0f;
      background-color: #ffffff;
    }

    header {
      text-align: center;
      padding: 48px 20px 32px;
    }

    header h1 {
      font-size: 34px;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin: 0;
    }

    header nav {
      margin-top: 12px;
    }

    header nav a {
      color: #6f6f6f;
      text-decoration: none;
      font-size: 18px;
      transition: color 0.2s ease;
    }

    header nav a:hover,
    header nav a:focus {
      color: #111111;
    }

    main {
      max-width: 1200px;
      margin: 0 auto 96px;
      padding: 0 20px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
    }

    @media (max-width: 1024px) {
      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }

    figure.artwork {
      margin: 0;
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #f3f3f3;
    }

    figure.artwork.has-hover {
      cursor: pointer;
    }

    figure.artwork:focus-within {
      outline: 2px solid #222222;
      outline-offset: 4px;
    }

    .image-stack {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .image-stack picture,
    .image-stack img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .base-image,
    .hover-image {
      object-fit: cover;
    }

    .base-image {
      transition: opacity 0.35s ease;
    }

    .hover-image {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    figure.artwork.has-hover:hover .hover-image,
    figure.artwork.has-hover:focus-within .hover-image {
      opacity: 1;
    }

    figure.artwork.has-hover:hover .base-image,
    figure.artwork.has-hover:focus-within .base-image {
      opacity: 0;
    }

    figcaption {
      display: none;
    }
  </style>
</head>
