<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caroline Coolidge</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      color: #0f0f0f;
      background-color: #ffffff;
    }

    header {
      text-align: center;
      padding: 48px 20px 32px;
    }

    header h1 {
      font-size: 34px;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin: 0;
    }

    header nav {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    header nav a {
      grid-column: 2;
      justify-self: center;
      color: #6f6f6f;
      text-decoration: none;
      font-size: 18px;
      transition: color 0.2s ease;
    }

    header nav a:hover,
    header nav a:focus {
      color: #111111;
    }

    main {
      max-width: 1200px;
      margin: 0 auto 48px;
      padding: 0 20px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
    }

    figure.artwork {
      margin: 0;
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #f3f3f3;
      cursor: pointer;
    }

    figure.artwork:focus,
    figure.artwork:focus-within {
      outline: 2px solid #222222;
      outline-offset: 4px;
    }

    .image-stack {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .image-stack picture,
    .image-stack img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .base-image,
    .hover-image {
      object-fit: cover;
    }

    .base-image {
      transition: opacity 0.35s ease;
    }

    .hover-image {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    figure.artwork.has-hover:hover .hover-image,
    figure.artwork.has-hover:focus-within .hover-image,
    figure.artwork.has-hover.is-pressing .hover-image {
      opacity: 1;
    }

    figure.artwork.has-hover:hover .base-image,
    figure.artwork.has-hover:focus-within .base-image,
    figure.artwork.has-hover.is-pressing .base-image {
      opacity: 0;
    }

    figcaption {
      display: none;
    }

    .site-footer {
      text-align: center;
      font-size: 16px;
      padding: 40px 20px 64px;
      letter-spacing: 0.04em;
      color: #6f6f6f;
    }

    @media (max-width: 1024px) {
      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script>
    document.querySelectorAll('img[data-fallback]').forEach((img) => {
      function handleBaseError() {
        const fallbackSrc = img.dataset.fallback;
        if (fallbackSrc && img.src !== fallbackSrc) {
          img.src = fallbackSrc;
        } else {
          img.removeEventListener('error', handleBaseError);
        }
      }

      img.addEventListener('error', handleBaseError);

      if (img.complete && img.naturalWidth === 0) {
        handleBaseError();
      }
    });

    document.querySelectorAll('.hover-image').forEach((img) => {
      function handleHoverError() {
        const parentFigure = img.closest('.artwork');
        if (parentFigure) {
          parentFigure.classList.remove('has-hover');
        }
        img.removeEventListener('error', handleHoverError);
        img.remove();
      }

      img.addEventListener('error', handleHoverError);

      if (img.complete && img.naturalWidth === 0) {
        handleHoverError();
      }
    });

    function navigateToGroup(groupId) {
      if (!groupId) return;
      const currentUrl = new URL(window.location.href);
      const basePath = currentUrl.pathname.replace(/[^/]*$/, '');
      const target = `${basePath}work.html?group=${encodeURIComponent(groupId)}`;
      window.location.assign(target);
    }

    const TOUCH_LONG_PRESS_DELAY = 350;
    const touchPressState = new WeakMap();
    const suppressClickAfterLongPress = new WeakSet();

    function clearTouchPressState(figure) {
      const state = touchPressState.get(figure);
      if (!state) {
        return null;
      }

      window.clearTimeout(state.timeoutId);
      touchPressState.delete(figure);
      return state;
    }

    function handleTouchPointerDown(event) {
      if (event.pointerType !== 'touch') return;

      const figure = event.currentTarget;
      if (!figure.classList.contains('has-hover')) return;

      clearTouchPressState(figure);

      const state = {
        triggered: false,
        timeoutId: window.setTimeout(() => {
          state.triggered = true;
          figure.classList.add('is-pressing');
        }, TOUCH_LONG_PRESS_DELAY)
      };

      touchPressState.set(figure, state);
    }

    function handleTouchPointerEnd(event) {
      if (event.pointerType !== 'touch') return;

      const figure = event.currentTarget;
      const state = clearTouchPressState(figure);

      if (figure.classList.contains('is-pressing')) {
        figure.classList.remove('is-pressing');
      }

      if (state && state.triggered) {
        suppressClickAfterLongPress.add(figure);
        window.setTimeout(() => suppressClickAfterLongPress.delete(figure), 0);
      }
    }

    document.querySelectorAll('figure.artwork[data-group]').forEach((figure) => {
      const groupId = figure.dataset.group;

      figure.addEventListener('pointerdown', handleTouchPointerDown);
      figure.addEventListener('pointerup', handleTouchPointerEnd);
      figure.addEventListener('pointercancel', handleTouchPointerEnd);
      figure.addEventListener('pointerleave', handleTouchPointerEnd);

      figure.addEventListener('click', () => {
        if (suppressClickAfterLongPress.has(figure)) {
          suppressClickAfterLongPress.delete(figure);
          return;
        }

        navigateToGroup(groupId);
      });

      figure.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          navigateToGroup(groupId);
        }
      });
    });

    const captionPhrase = 'As Smoke Loses Itself in Air';

    function italicizePhraseInElement(element, phrase) {
      if (!element || !phrase) return;

      const walker = document.createTreeWalker(
        element,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode(node) {
            return node.textContent && node.textContent.includes(phrase)
              ? NodeFilter.FILTER_ACCEPT
              : NodeFilter.FILTER_SKIP;
          }
        }
      );

      const nodesToProcess = [];
      while (walker.nextNode()) {
        nodesToProcess.push(walker.currentNode);
      }

      nodesToProcess.forEach((textNode) => {
        const originalText = textNode.textContent;
        if (!originalText) return;

        const parent = textNode.parentNode;
        if (!parent) return;

        const fragment = document.createDocumentFragment();
        let searchIndex = 0;
        let matchIndex = originalText.indexOf(phrase, searchIndex);

        while (matchIndex !== -1) {
          if (matchIndex > searchIndex) {
            fragment.appendChild(
              document.createTextNode(originalText.slice(searchIndex, matchIndex))
            );
          }

          const emphasis = document.createElement('em');
          emphasis.textContent = phrase;
          fragment.appendChild(emphasis);

          searchIndex = matchIndex + phrase.length;
          matchIndex = originalText.indexOf(phrase, searchIndex);
        }

        if (searchIndex < originalText.length) {
          fragment.appendChild(document.createTextNode(originalText.slice(searchIndex)));
        }

        parent.replaceChild(fragment, textNode);
      });
    }

    document
      .querySelectorAll('.gallery-caption, figcaption')
      .forEach((caption) => italicizePhraseInElement(caption, captionPhrase));
  </script>
