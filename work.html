    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      color: #0f0f0f;
      background-color: #ffffff;
    }

    header {
      position: relative;
      text-align: center;
      padding: 48px 20px 32px;
    }

    header h1 {
      font-size: 30px;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin: 0;
    }

    .header-nav-spacer {
      margin-top: 12px;
      font-size: 16px;
      visibility: hidden;
    }

    .close-button {
      position: absolute;
      top: 48px;
      right: 32px;
      font-size: 28px;
      line-height: 1;
      text-decoration: none;
      color: #0f0f0f;
      padding: 8px;
      transition: color 0.2s ease;
    }

    .close-button:hover,
    .close-button:focus {
      color: #EE5C35;
    }

    main {
      max-width: 920px;
      margin: 0 auto 24px;
      padding: 0 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .detail-image {
      margin: 0 0 16px;
      display: flex;
      justify-content: center;
    }

    main > .detail-image:last-of-type {
      margin-bottom: 16px;
    }

    .detail-image img {
      width: min(94%, 700px);
      height: auto;
      display: block;
      background: #f3f3f3;
    }

    .work-details {
      margin: 0 auto 0;
      max-width: min(94%, 860px);
      font-size: 17px;
      line-height: 1.6;
      color: #2f2f2f;
      text-align: center;
    }

    .work-title {
      font-size: 18px;
    }

    .work-details p {
      margin: 0;
    }

    .work-details p + p {
      margin-top: 8px;
    }

    .work-title + p {
      margin-top: 14px;
    }

    .site-footer {
      text-align: center;
      font-size: 16px;
      padding: 32px 20px 48px;
      letter-spacing: 0.04em;
      color: #6f6f6f;
    }

    @media (min-width: 900px) {
      main {
        max-width: 1200px;
      }

      .detail-image img {
        width: min(96%, 1000px);
      }

      .work-details {
        max-width: min(96%, 1000px);
      }
    }

    @media (max-width: 640px) {
      header {
        padding: 40px 16px 28px;
      }

      header h1 {
        font-size: 26px;
      }

      .close-button {
        top: 40px;
        right: 20px;
      }

      main {
        padding: 0 20px 32px;
        gap: 0;
      }

      .detail-image img {
        width: 100%;
      }

      .work-details {
        max-width: 100%;
      }

    }

    @media (max-width: 375px) and (max-height: 700px) {
      header {
        padding-top: 28px;
      }

      .close-button {
        top: 28px;
      }
    }
  </style>

    const params = new URLSearchParams(window.location.search);
    const groupId = params.get('group');
    const detailContainer = document.querySelector('[data-detail-container]');

    const escapeHTML = (value) =>
      String(value).replace(/[&<>"']/g, (char) => (
        {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char] || char
      ));

    const formatSubtitle = (title) => {
      if (typeof title !== 'string') {
        if (title == null) {
          return '';
        }

        return `<em>${escapeHTML(String(title))}</em>`;
      }

      const trimmed = title.trim();

      if (!trimmed) {
        return '';
      }

      const match = trimmed.match(/^(.*?)(,\s*\d{4}(?:\s*[–-]\s*\d{4})?)$/);

      if (match) {
        const [, textPart, yearPart] = match;
        const safeText = escapeHTML(textPart.trim());
        const safeYear = yearPart ? escapeHTML(yearPart) : '';
        return `${safeText ? `<em>${safeText}</em>` : ''}${safeYear}`;
      }

      return `<em>${escapeHTML(trimmed)}</em>`;
    };

    if (!groupId || !WORKS[groupId]) {
      window.location.replace('index.html');
    } else {
      const work = WORKS[groupId];
      document.title = `Caroline Coolidge – ${work.title}`;

      const fragment = document.createDocumentFragment();
      work.images.forEach((src) => {
        const figure = document.createElement('figure');
        figure.className = 'detail-image';

        const image = document.createElement('img');
        image.src = src;
        const fileKey = src.split('/').pop()?.replace(/\.jpg$/i, '') ?? '';
        image.alt = ALT_TEXT[fileKey] || work.title;
        image.loading = 'lazy';

        figure.appendChild(image);
        fragment.appendChild(figure);
      });

      detailContainer.appendChild(fragment);

      const detailsWrapper = document.createElement('section');
      detailsWrapper.className = 'work-details';

      const title = document.createElement('p');
      title.className = 'work-title';
      title.innerHTML = formatSubtitle(work.title);
      detailsWrapper.appendChild(title);

      if (Array.isArray(work.details) && work.details.length) {
        work.details.forEach((detailLine) => {
          const p = document.createElement('p');
          p.innerHTML = detailLine;
          detailsWrapper.appendChild(p);
        });
      }

      detailContainer.appendChild(detailsWrapper);
