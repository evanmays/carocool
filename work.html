      font-family: "Times New Roman", Times, serif;
      color: #0f0f0f;
      background-color: #ffffff;
    }

    header {
      text-align: center;
      padding: 48px 20px 30px;
      position: relative;
    }

    header h1 {
      font-size: 34px;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin: 0;
    }

    .work-subtitle {
      margin: 32px 0 0;
      font-size: 18px;
      color: #555555;
    }

    .close-button {
      position: absolute;
      top: 28px;
      right: 24px;
      font-size: 28px;
      line-height: 1;
      text-decoration: none;
      color: #0f0f0f;
      padding: 8px;
      transition: color 0.2s ease;
    }

    .close-button:hover,
    .close-button:focus {
      color: #6f6f6f;
    }

    main {
      max-width: 920px;
      margin: 0 auto 120px;
      padding: 0 20px 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .detail-image {
      margin: 0 0 32px;
      display: flex;
      justify-content: center;
    }

    .detail-image img {
      width: min(94%, 700px);
      height: auto;
      display: block;
      background: #f3f3f3;
    }

    .work-details {
      margin: 16px auto 0;
      max-width: min(94%, 860px);
      font-size: 17px;
      line-height: 1.6;
      color: #2f2f2f;
      text-align: center;
    }

    .work-details p {
      margin: 0;
    }

    .work-details p + p {
      margin-top: 8px;
    }

    .missing-message {
      text-align: center;
      margin: 120px 0;
      font-size: 20px;
    }

    @media (max-width: 640px) {
      header {
        padding-top: 32px;
      }

      .close-button {
        top: 16px;
        right: 16px;
      }

      main {
        gap: 32px;
      }
    }
  </style>

    const params = new URLSearchParams(window.location.search);
    const groupId = params.get('group');
    const detailContainer = document.querySelector('[data-detail-container]');
    const subtitleEl = document.querySelector('[data-work-subtitle]');
    const missingMessage = document.querySelector('[data-missing-message]');

    const escapeHTML = (value) =>
      String(value).replace(/[&<>"']/g, (char) => (
        {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char] || char
      ));

    const formatSubtitle = (title) => {
      if (typeof title !== 'string') {
        if (title == null) {
          return '';
        }

        return `<em>${escapeHTML(String(title))}</em>`;
      }

      const trimmed = title.trim();

      if (!trimmed) {
        return '';
      }

      const match = trimmed.match(/^(.*?)(,\s*\d{4}(?:\s*[–-]\s*\d{4})?)$/);

      if (match) {
        const [, textPart, yearPart] = match;
        const safeText = escapeHTML(textPart.trim());
        const safeYear = yearPart ? escapeHTML(yearPart) : '';
        return `${safeText ? `<em>${safeText}</em>` : ''}${safeYear}`;
      }

      return `<em>${escapeHTML(trimmed)}</em>`;
    };

    if (!groupId || !WORKS[groupId]) {
      missingMessage.hidden = false;
    } else {
      const work = WORKS[groupId];
      document.title = `Caroline Coolidge – ${work.title}`;
      subtitleEl.innerHTML = formatSubtitle(work.title);
      subtitleEl.hidden = false;

      const fragment = document.createDocumentFragment();
      work.images.forEach((src) => {
        const figure = document.createElement('figure');
        figure.className = 'detail-image';

        const image = document.createElement('img');
        image.src = src;
        const fileKey = src.split('/').pop()?.replace(/\.jpg$/i, '') ?? '';
        image.alt = ALT_TEXT[fileKey] || work.title;
        image.loading = 'lazy';

        figure.appendChild(image);
        fragment.appendChild(figure);
      });

      detailContainer.appendChild(fragment);

      if (Array.isArray(work.details) && work.details.length) {
        const detailsWrapper = document.createElement('section');
        detailsWrapper.className = 'work-details';

        work.details.forEach((detailLine) => {
          const p = document.createElement('p');
          p.innerHTML = detailLine;
          detailsWrapper.appendChild(p);
        });

        detailContainer.appendChild(detailsWrapper);
      }
